<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 파스텔 배당금 계산기</title>
    <style>
        :root {
            --bg-color: #fdfcf0; /* 부드러운 크림색 */
            --container-bg: #ffffff;
            --text-color: #4a4a4a;
            --header-color: #ffb7b2; /* 파스텔 핑크 */
            --label-color: #b2e2f2; /* 파스텔 블루 */
            --border-color: #f1f3f4;
            --input-border: #f1f3f4;
            --input-focus: #ffb7b2;
            --btn-add-bg: #b2e2f2;
            --btn-add-hover: #92d2e2;
            --btn-calc-bg: #ffb7b2;
            --btn-calc-hover: #ff9d97;
            --btn-manage-bg: #e2f0cb; /* 파스텔 그린 */
            --btn-manage-hover: #d2e0bb;
            --btn-secondary-bg: #ffccbc;
            --btn-secondary-text: #5d4037;
            --btn-reset-bg: #eeeeee;
            --btn-reset-hover: #dddddd;
            --table-header-bg: #fdfcf0;
            --table-row-bg: #ffffff;
            --result-summary-bg: #fff5f5;
            --result-summary-border: #ffe4e1;
            --manage-section-bg: #f0faff;
            --card-bg: #ffffff;
            --strategy-border: #ffccbc;
            --strategy-title: #e64a19;
            --nav-bg: rgba(255, 255, 255, 0.9);
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --container-bg: #2d2d2d;
            --text-color: #e0e0e0;
            --header-color: #ffb7b2;
            --label-color: #81d4fa;
            --border-color: #444444;
            --input-border: #444444;
            --input-focus: #ffb7b2;
            --btn-add-bg: #5a7a8a; /* Soft Pastel Blue */
            --btn-add-hover: #6a8a9a;
            --btn-calc-bg: #9a7a7a; /* Soft Pastel Pink/Red */
            --btn-calc-hover: #aa8a8a;
            --btn-manage-bg: #7a8a6a; /* Soft Pastel Green */
            --btn-manage-hover: #8a9a7a;
            --btn-secondary-bg: #8a7a6a; /* Soft Pastel Brown */
            --btn-secondary-text: #ffffff;
            --btn-reset-bg: #3d3d3d;
            --btn-reset-hover: #4d4d4d;
            --table-header-bg: #1a1a1a;
            --table-row-bg: #3d3d3d;
            --result-summary-bg: #3d2b2b;
            --result-summary-border: #5d4037;
            --manage-section-bg: #1e262b;
            --card-bg: #3d3d3d;
            --strategy-border: #bf360c;
            --strategy-title: #ffab91;
            --nav-bg: rgba(45, 45, 45, 0.9);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Top Navigation Menu */
        .top-nav {
            position: sticky;
            top: 0;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(10px);
            z-index: 1000;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            padding: 12px 0;
            display: flex;
            justify-content: center;
        }
        .nav-container {
            width: 100%;
            max-width: 850px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
        }
        .nav-item {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 700;
            font-size: 16px;
            padding: 10px 20px;
            border-radius: 15px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .nav-item:hover {
            background: var(--bg-color);
            color: var(--header-color);
            transform: translateY(-2px);
        }
        .nav-item.active {
            background: var(--header-color);
            color: white;
        }

        .theme-toggle {
            background: none;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .theme-toggle:hover {
            transform: rotate(360deg);
            background: var(--bg-color);
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--container-bg);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.05);
            margin: 30px 0 100px 0;
            position: relative;
            box-sizing: border-box;
        }
        h1, h2 {
            color: var(--header-color);
            text-align: center;
            font-weight: 800;
            margin-bottom: 30px;
        }
        .section {
            margin-bottom: 60px;
            padding-bottom: 40px;
            border-bottom: 2px dashed var(--border-color);
            scroll-margin-top: 100px; /* Space for sticky nav */
        }
        .section:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }
        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            align-items: center;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .input-group label {
            width: 30px;
            font-weight: 800;
            color: var(--label-color);
            text-align: center;
        }
        select, input {
            padding: 14px;
            border: 2px solid var(--input-border);
            border-radius: 15px;
            flex: 1;
            font-size: 15px;
            transition: all 0.3s;
            outline: none;
            min-width: 0;
            background-color: var(--container-bg);
            color: var(--text-color);
        }
        select:focus, input:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 4px rgba(255, 183, 178, 0.2);
        }
        .stock-select { flex: 2; }
        .stock-qty { flex: 1; }
        .stock-monthly-div { flex: 1; }

        .btn-container {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        button {
            padding: 16px;
            border: none;
            border-radius: 18px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 12px rgba(0,0,0,0.05);
        }
        button:active {
            transform: scale(0.98);
        }
        .add-btn {
            background-color: var(--btn-add-bg);
            color: white;
            flex: 1;
            min-width: 130px;
        }
        .calc-btn {
            background-color: var(--btn-calc-bg);
            color: white;
            flex: 1;
            min-width: 130px;
        }
        .manage-btn {
            background-color: var(--btn-manage-bg);
            color: white;
            flex: 1;
            min-width: 130px;
        }
        .reset-btn {
            background-color: var(--btn-reset-bg);
            color: var(--text-color);
            flex: 0.6;
            min-width: 90px;
        }
        .secondary-btn {
            background-color: var(--btn-secondary-bg);
            color: var(--btn-secondary-text);
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
            margin-top: 30px;
        }
        th, td {
            padding: 18px 12px;
            text-align: center;
            border: none;
            font-size: 15px;
            transition: all 0.3s;
        }
        th {
            background-color: var(--table-header-bg);
            color: #888;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        td {
            background-color: var(--table-row-bg);
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }
        tr td:first-child { border-left: 1px solid var(--border-color); border-radius: 15px 0 0 15px; }
        tr td:last-child { border-right: 1px solid var(--border-color); border-radius: 0 15px 15px 0; }

        .result-summary {
            background: var(--result-summary-bg);
            padding: 30px;
            border-radius: 25px;
            margin-top: 30px;
            text-align: center;
            border: 2px solid var(--result-summary-border);
            transition: all 0.3s;
        }
        .remove-btn {
            background: var(--btn-calc-bg);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 14px;
        }
        .manage-section {
            background: var(--manage-section-bg);
            padding: 25px;
            border-radius: 25px;
            margin-top: 25px;
            transition: all 0.3s;
        }
        .manage-content {
            display: none;
            margin-top: 20px;
        }
        .stock-tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
        }
        .stock-tag {
            background: var(--card-bg);
            padding: 10px 18px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            font-size: 14px;
            transition: all 0.3s;
        }
        .stock-tag .del-icon {
            color: var(--header-color);
            cursor: pointer;
            font-weight: 900;
        }
        .add-stock-form {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .asset-input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }
        .strategy-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            border-left: 6px solid var(--strategy-border);
            margin-top: 30px;
            text-align: left;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            transition: all 0.3s;
        }
        .roadmap-container {
            margin-top: 35px;
            padding-top: 25px;
            border-top: 2px dashed var(--border-color);
        }
        .roadmap-title {
            font-size: 1.2em;
            font-weight: 800;
            color: var(--header-color);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .roadmap-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }
        .roadmap-item {
            background: var(--bg-color);
            padding: 20px;
            border-radius: 18px;
            border: 1px solid var(--border-color);
            transition: all 0.3s;
        }
        .roadmap-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .roadmap-year {
            font-weight: 900;
            color: var(--label-color);
            margin-bottom: 10px;
            font-size: 1em;
        }
        .warning-text {
            color: #d32f2f;
            font-size: 0.9em;
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            padding: 10px;
            background: rgba(211, 47, 47, 0.05);
            border-radius: 12px;
        }
        [data-theme="dark"] .warning-text {
            color: #ffab91;
            background: rgba(255, 171, 145, 0.1);
        }
    </style>
</head>
<body>
    <!-- Top Navigation Menu -->
    <nav class="top-nav">
        <div class="nav-container">
            <a href="#calculator-section" class="nav-item">🌸 배당계산기</a>
            <a href="#strategy-section" class="nav-item">💡 자산운영</a>
            <a href="#portfolio-section" class="nav-item">🏆 추천포트</a>
            <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="테마 전환">☀️</button>
        </div>
    </nav>

    <div class="container">
        <!-- Section 1: Calculator -->
        <div class="section" id="calculator-section">
            <h1>🌸 배당금 계산기</h1>
            <p style="text-align: center; color: #888; margin-bottom: 30px;">보유 종목을 입력하고 월 예상 배당금을 확인하세요.</p>
            
            <div id="calculator-inputs"></div>

            <div class="btn-container">
                <button class="add-btn" onclick="addStockRow()">➕ 종목 추가</button>
                <button class="calc-btn" onclick="calculateUserDividends()">📊 종합 계산</button>
                <button class="manage-btn" onclick="toggleManageSection()">⚙️ 마스터 관리</button>
                <button class="reset-btn" onclick="resetCalculator()">🔄 리셋</button>
            </div>

            <div id="calc-result"></div>
        </div>

        <!-- Master Data Management (Hidden by default) -->
        <div class="manage-content-container">
            <div class="section manage-section" id="manage-section" style="display: none;">
                <div class="manage-content" id="manage-content" style="display: block;">
                    <h2 style="margin-bottom: 10px; font-size: 1.5em; color: var(--label-color);">⚙️ 종목 마스터 관리</h2>
                    <p style="font-size: 0.9em; color: #777;">리스트에 표시될 기본 종목 데이터를 관리합니다.</p>
                    
                    <div class="add-stock-form">
                        <input type="text" id="new-stock-name" placeholder="새 종목명">
                        <input type="number" id="new-stock-annual" placeholder="연간 배당금(원)">
                        <button class="add-btn" onclick="addNewStockMaster()" style="padding: 10px 20px; flex: 0 0 auto;">추가</button>
                    </div>

                    <div class="stock-tag-list" id="stock-tag-list"></div>
                </div>
            </div>
        </div>

        <!-- Section 2: Asset Proposal -->
        <div class="section" id="strategy-section">
            <h2>💰 맞춤형 자산 운영 제안</h2>
            <p style="text-align: center; color: #888; margin-bottom: 20px;">나이와 현재 자산 규모를 바탕으로 향후 로드맵을 제안합니다.</p>
            <div class="asset-input-group">
                <input type="number" id="user-age" placeholder="나이 (세)">
                <input type="number" id="real-estate" placeholder="부동산 자산 (만원)">
                <input type="number" id="movable-asset" placeholder="금융 자산 (만원)">
            </div>
            <div class="btn-container">
                <button class="secondary-btn" onclick="suggestAssetStrategy()" style="flex: 1;">제안 받기 💡</button>
                <button class="reset-btn" onclick="resetStrategy()">🔄 리셋</button>
            </div>
            <div id="strategy-result"></div>
        </div>

        <!-- Section 3: Recommended Portfolio -->
        <div class="section" id="portfolio-section">
            <h2>🏆 월배당 추천 포트폴리오</h2>
            <p style="text-align: center; color: #888; margin-bottom: 20px;">자본금 또는 목표 배당금에 맞춘 AI 추천 구성을 확인하세요.</p>
            <div class="asset-input-group">
                <input type="number" id="target-capital" placeholder="투자 가능 자본금 (만원)">
                <input type="number" id="target-monthly-dividend" placeholder="목표 월 배당금 (만원)">
            </div>
            <div class="btn-container">
                <button class="secondary-btn" style="background-color: var(--btn-manage-bg); color: white; flex: 1;" onclick="showPortfolio()">포트폴리오 구성하기 ✨</button>
                <button class="reset-btn" onclick="resetPortfolio()">🔄 리셋</button>
            </div>
            <p class="warning-text">⚠️ AI 알고리즘 추천 결과로, 투자는 본인이 직접 신중하게 결정해야 합니다.</p>
            <div id="portfolio-result"></div>
        </div>
    </div>

    <script>
        // Theme Management
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            document.getElementById('theme-toggle').innerText = newTheme === 'dark' ? '🌙' : '☀️';
            localStorage.setItem('theme', newTheme);
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('theme-toggle').innerText = savedTheme === 'dark' ? '🌙' : '☀️';

        // Default Data
        const defaultStockData = {
            "삼성전자": { name: "삼성전자", annualDividend: 1444 },
            "삼성전자우": { name: "삼성전자우", annualDividend: 1445 },
            "SK하이닉스": { name: "SK하이닉스", annualDividend: 1200 },
            "맥쿼리인프라": { name: "맥쿼리인프라", annualDividend: 770 },
            "TIGER 미국배당다우존스": { name: "TIGER 미국배당다우존스", annualDividend: 420 },
            "SOL 미국배당다우존스": { name: "SOL 미국배당다우존스", annualDividend: 400 },
            "KODEX 미국배당프리미엄액티브": { name: "KODEX 미국배당프리미엄액티브", annualDividend: 660 },
            "TIGER 미국테크TOP10+10%프리미엄": { name: "TIGER 미국테크TOP10+10%프리미엄", annualDividend: 1200 },
            "TIGER 리츠부동산인프라": { name: "TIGER 리츠부동산인프라", annualDividend: 360 },
            "신한지주": { name: "신한지주", annualDividend: 2100 },
            "KB금융": { name: "KB금융", annualDividend: 3000 },
            "현대차": { name: "현대차", annualDividend: 11400 },
            "ESR켄달스퀘어리츠": { name: "ESR켄달스퀘어리츠", annualDividend: 270 },
            "SK리츠": { name: "SK리츠", annualDividend: 260 },
            "제이알글로벌리츠": { name: "제이알글로벌리츠", annualDividend: 380 },
            "KODEX CD금리액티브(합성)": { name: "KODEX CD금리액티브(합성)", annualDividend: 30000 },
            "KIWOOM 미국고배당&AI테크": { name: "KIWOOM 미국고배당&AI테크", annualDividend: 384 },
            "KODEX 미국성장커버드콜액티브": { name: "KODEX 미국성장커버드콜액티브", annualDividend: 1140 },
            "SOL 코리아고배당": { name: "SOL 코리아고배당", annualDividend: 720 },
            "TIGER 미국배당다우존스타겟데일리커버드콜": { name: "TIGER 미국배당다우존스타겟데일리커버드콜", annualDividend: 1200 },
            "KODEX 미국배당커버드콜액티브": { name: "KODEX 미국배당커버드콜액티브", annualDividend: 1176 }
        };

        let stockData = JSON.parse(localStorage.getItem('myStockMaster')) || defaultStockData;

        function toggleManageSection() {
            const section = document.getElementById('manage-section');
            section.style.display = section.style.display === "none" ? "block" : "none";
        }

        function saveStockMaster() {
            localStorage.setItem('myStockMaster', JSON.stringify(stockData));
            updateAllDropdowns();
            renderStockMasterList();
        }

        function addNewStockMaster() {
            const name = document.getElementById('new-stock-name').value.trim();
            const annual = parseInt(document.getElementById('new-stock-annual').value) || 0;
            if (!name) return;
            stockData[name] = { name: name, annualDividend: annual };
            saveStockMaster();
            document.getElementById('new-stock-name').value = "";
            document.getElementById('new-stock-annual').value = "";
        }

        function deleteStockMaster(name) {
            if (confirm(`'${name}'을 삭제하시겠습니까?`)) {
                delete stockData[name];
                saveStockMaster();
            }
        }

        function renderStockMasterList() {
            const listContainer = document.getElementById('stock-tag-list');
            listContainer.innerHTML = "";
            Object.keys(stockData).forEach(name => {
                const tag = document.createElement('div');
                tag.className = 'stock-tag';
                tag.innerHTML = `<span>${name}</span><span class="del-icon" onclick="deleteStockMaster('${name}')">✕</span>`;
                listContainer.appendChild(tag);
            });
        }

        function updateAllDropdowns() {
            const dropdowns = document.querySelectorAll('.stock-select');
            const optionsHTML = generateOptionsHTML();
            dropdowns.forEach(dp => {
                const currentVal = dp.value;
                dp.innerHTML = optionsHTML;
                dp.value = currentVal;
            });
        }

        function generateOptionsHTML() {
            let html = `<option value="">종목 선택</option>`;
            Object.keys(stockData).sort().forEach(stock => {
                html += `<option value="${stock}">${stock}</option>`;
            });
            return html;
        }

        const inputContainer = document.getElementById('calculator-inputs');
        let rowCount = 0;

        function addStockRow() {
            rowCount++;
            const div = document.createElement('div');
            div.className = 'input-group';
            div.id = `row-${rowCount}`;
            div.innerHTML = `
                <label>${rowCount}</label>
                <select class="stock-select" onchange="autoFillDividend(this)">${generateOptionsHTML()}</select>
                <input type="number" class="stock-qty" placeholder="수량">
                <input type="number" class="stock-monthly-div" placeholder="배당금/월">
                <button class="remove-btn" onclick="removeRow(${rowCount})">✕</button>
            `;
            inputContainer.appendChild(div);
        }

        function removeRow(id) {
            const row = document.getElementById(`row-${id}`);
            if (row) row.remove();
        }

        function autoFillDividend(selectElement) {
            const row = selectElement.closest('.input-group');
            const monthlyDivInput = row.querySelector('.stock-monthly-div');
            const stockName = selectElement.value;
            if (stockName && stockData[stockName]) {
                monthlyDivInput.value = Math.floor(stockData[stockName].annualDividend / 12);
            }
        }

        function resetCalculator() {
            inputContainer.innerHTML = "";
            rowCount = 0;
            addStockRow();
            document.getElementById('calc-result').innerHTML = "";
        }

        function resetStrategy() {
            document.getElementById('user-age').value = "";
            document.getElementById('real-estate').value = "";
            document.getElementById('movable-asset').value = "";
            document.getElementById('strategy-result').innerHTML = "";
        }

        function resetPortfolio() {
            document.getElementById('target-capital').value = "";
            document.getElementById('target-monthly-dividend').value = "";
            document.getElementById('portfolio-result').innerHTML = "";
        }

        function calculateUserDividends() {
            let totalAnnual = 0;
            let results = [];
            document.querySelectorAll('.input-group').forEach(row => {
                const name = row.querySelector('.stock-select').value || "직접입력";
                const qty = parseInt(row.querySelector('.stock-qty').value) || 0;
                const monthlyDiv = parseInt(row.querySelector('.stock-monthly-div').value) || 0;
                if (qty > 0 && monthlyDiv > 0) {
                    const total = monthlyDiv * 12 * qty;
                    totalAnnual += total;
                    results.push({ name, qty, monthlyDiv, total });
                }
            });

            if (results.length === 0) { alert("데이터를 입력해주세요."); return; }

            let resultHTML = `<div class="result-summary">
                <h3 style="color: var(--header-color); margin-top: 0;">🌸 내 포트폴리오 결과</h3>
                <p>연간 총 배당금: <strong>${totalAnnual.toLocaleString()}원</strong></p>
                <p>월평균 배당금: <strong>${Math.floor(totalAnnual / 12).toLocaleString()}원</strong></p>
            </div>
            <table><tr><th>종목명</th><th>보유수량</th><th>월배당금</th><th>합계</th></tr>`;
            results.forEach(res => {
                resultHTML += `<tr><td>${res.name}</td><td>${res.qty.toLocaleString()}주</td><td>${res.monthlyDiv.toLocaleString()}원</td><td>${res.total.toLocaleString()}원</td></tr>`;
            });
            document.getElementById('calc-result').innerHTML = resultHTML + "</table>";
        }

                    "건강보험료 부담을 줄이기 위한 ISA 등의 비과세 계좌 활용을 극대화하세요.",

                ];
                roadmap = [

        function showPortfolio() {
            const capitalInput = parseInt(document.getElementById('target-capital').value) * 10000 || 0;
            const targetDivInput = parseInt(document.getElementById('target-monthly-dividend').value) * 10000 || 0;

            const stocks = [
                { name: "TIGER 미국배당다우존스", dividendPerMonth: 35, price: 11500, weight: 0.3 },
                { name: "TIGER 미국테크TOP10+10%프리미엄", dividendPerMonth: 100, price: 12000, weight: 0.2 },
                { name: "TIGER 리츠부동산인프라", dividendPerMonth: 30, price: 4500, weight: 0.2 },
                { name: "SOL 미국배당다우존스", dividendPerMonth: 33, price: 11000, weight: 0.15 },
                { name: "KODEX 미국배당프리미엄액티브", dividendPerMonth: 55, price: 10500, weight: 0.15 },
            ];

            let totalCapital = capitalInput;
            let mode = "capital";

            if (totalCapital === 0 && targetDivInput > 0) {
                let avgDividendYield = 0;
                stocks.forEach(s => { avgDividendYield += (s.dividendPerMonth / s.price) * s.weight; });
                totalCapital = targetDivInput / avgDividendYield;
                mode = "dividend";
            }

            if (totalCapital === 0) {
                alert("자본금 또는 목표 배당금을 입력해주세요.");
                return;
            }

            let calculatedStocks = stocks.map(stock => {
                const allocatedCapital = totalCapital * stock.weight;
                const shareCount = Math.floor(allocatedCapital / stock.price);
                const monthlyTotal = shareCount * stock.dividendPerMonth;
                const investment = shareCount * stock.price;
                return { ...stock, shareCount, monthlyTotal, investment };
            });

            let finalTotalCapital = calculatedStocks.reduce((sum, s) => sum + s.investment, 0);
            let finalTotalMonthly = calculatedStocks.reduce((sum, s) => sum + s.monthlyTotal, 0);

            let gapInfo = "";
            if (targetDivInput > 0) {
                const diff = targetDivInput - finalTotalMonthly;
                if (Math.abs(diff) > 1000) {
                    if (capitalInput > 0 && finalTotalMonthly < targetDivInput) {
                        gapInfo = `<div class="warning-text" style="background: rgba(211, 47, 47, 0.1); margin-bottom: 20px;">
                            ⚠️ 알림: 입력하신 자본금으로는 목표 배당금 달성이 현실적으로 어렵습니다. 약 ${(targetDivInput / (finalTotalMonthly/finalTotalCapital) / 10000).toFixed(0).toLocaleString()}만원 이상의 자본금이 필요합니다.
                        </div>`;
                    }
                }
            }

            let resultHTML = `
                <div class="result-summary" style="background: var(--manage-section-bg); border-color: var(--label-color);">
                    <h3 style="color: var(--label-color); margin-top: 0;">📊 맞춤 포트폴리오 분석 (${mode === 'capital' ? '자본금 기준' : '목표 배당 기준'})</h3>
                    <p>총 투자 필요 자산: <strong>약 ${finalTotalCapital.toLocaleString()}원</strong></p>
                    <p>예상 월 배당금: <strong>약 ${finalTotalMonthly.toLocaleString()}원</strong></p>
                    <p style="font-size: 0.9em; color: #888; margin-top: 10px;">(연 예상 수익률: 약 ${((finalTotalMonthly * 12 / finalTotalCapital) * 100).toFixed(2)}%)</p>
                </div>
                ${gapInfo}
                <table>
                    <tr>
                        <th>종목명</th>
                        <th>추천 주식수</th>
                        <th>투자금액</th>
                        <th>월배당금</th>
                    </tr>
            `;

            calculatedStocks.forEach(stock => {
                if (stock.shareCount > 0) {
                    resultHTML += `
                        <tr>
                            <td>${stock.name}</td>
                            <td>${stock.shareCount.toLocaleString()}주</td>
                            <td>${stock.investment.toLocaleString()}원</td>
                            <td>${stock.monthlyTotal.toLocaleString()}원</td>
                        </tr>
                    `;
                }
            });
            resultHTML += "</table>";
            document.getElementById("portfolio-result").innerHTML = resultHTML;
        }

        // Section highlighting logic
        const sections = document.querySelectorAll('.section');
        const navItems = document.querySelectorAll('.nav-item');

        const observerOptions = {
            root: null,
            rootMargin: '-150px 0px -70% 0px',
            threshold: 0
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const id = entry.target.getAttribute('id');
                    // Special case for calculator-section because manage-section might interfere
                    if (id === 'manage-section') return; 

                    navItems.forEach(item => {
                        item.classList.remove('active');
                        if (item.getAttribute('href') === `#${id}`) {
                            item.classList.add('active');
                        }
                    });
                }
            });
        }, observerOptions);

        sections.forEach(section => {
            if (section.id !== 'manage-section') {
                observer.observe(section);
            }
        });

        // Init
        addStockRow();
        renderStockMasterList();
    </script>
