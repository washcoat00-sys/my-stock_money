
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>월배당 300만원 만들기</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        button {
            margin: 10px 0;
            padding: 10px;
            font-size: 16px;
        }
        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 80%;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>월배당 300만원 포트폴리오</h1>
        <p>월 300만원의 배당금을 받기 위한 추천 포트폴리오입니다.</p>
        <button onclick="showPortfolio()">추천 종목 확인</button>
        <div id="result"></div>
    </div>

    <script>
        function showPortfolio() {
            const stocks = [
                { name: "TIGER 미국배당다우존스", dividendPerMonth: 35, shareCount: 30000, price: 11500, yield: 3.6 },
                { name: "TIGER 미국테크TOP10+10%프리미엄", dividendPerMonth: 100, shareCount: 10000, price: 12000, yield: 10.0 },
                { name: "TIGER 리츠부동산인프라", dividendPerMonth: 30, shareCount: 20000, price: 4500, yield: 8.0 },
                { name: "SOL 미국배당다우존스", dividendPerMonth: 33, shareCount: 15000, price: 11000, yield: 3.6 },
                { name: "KODEX 미국배당프리미엄액티브", dividendPerMonth: 55, shareCount: 10000, price: 10500, yield: 6.3 },
            ];

            let totalMonthlyDividend = 0;
            let totalRequiredCapital = 0;
            stocks.forEach(stock => {
                totalMonthlyDividend += stock.dividendPerMonth * stock.shareCount;
                totalRequiredCapital += stock.price * stock.shareCount;
            });

            let resultHTML = `
                <h2>월배당 300만원 포트폴리오 결과 (ALL 월배당 ETF)</h2>
                <div style="background: #eef7ff; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #bce0fd;">
                    <p><strong>총 투자 필요 자산: 약 ${totalRequiredCapital.toLocaleString()}원</strong></p>
                    <p><strong>예상 월 합계 배당금: 약 ${totalMonthlyDividend.toLocaleString()}원</strong></p>
                    <p>예상 연간 합계 배당금: 약 ${(totalMonthlyDividend * 12).toLocaleString()}원</p>
                </div>
                <table>
                    <tr>
                        <th>종목명 (국내상장)</th>
                        <th>추천 주식수</th>
                        <th>현재가(추정)</th>
                        <th>주당 월 배당금</th>
                        <th>월 배당금</th>
                        <th>연 배당률</th>
                    </tr>
            `;

            stocks.forEach(stock => {
                const monthlyDividend = stock.dividendPerMonth * stock.shareCount;
                resultHTML += `
                    <tr>
                        <td>${stock.name}</td>
                        <td>${stock.shareCount.toLocaleString()}주</td>
                        <td>${stock.price.toLocaleString()}원</td>
                        <td>${stock.dividendPerMonth.toLocaleString()}원</td>
                        <td>${monthlyDividend.toLocaleString()}원</td>
                        <td>${stock.yield}%</td>
                    </tr>
                `;
            });

            resultHTML += "</table>";

            document.getElementById("result").innerHTML = resultHTML;
        }
    </script>
</body>
</html>
