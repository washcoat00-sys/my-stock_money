<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배당금 계산기 & 월배당 포트폴리오</title>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h1, h2 {
            color: #1a73e8;
            text-align: center;
        }
        .section {
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .calculator-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
            align-items: center;
        }
        .input-group label {
            width: 30px;
            font-weight: bold;
            color: #666;
        }
        input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            flex: 1;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1557b0;
        }
        .secondary-btn {
            background-color: #6c757d;
            margin-top: 10px;
        }
        .secondary-btn:hover {
            background-color: #5a6268;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #dee2e6;
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #f1f3f4;
        }
        .result-summary {
            background: #e8f0fe;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
        }
        .stock-list-info {
            font-size: 0.9em;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="section">
            <h1>📊 배당금 계산기 (최대 10종목)</h1>
            <p style="text-align: center;">종목명(또는 코드)과 수량을 입력하세요.</p>
            
            <div id="calculator-inputs">
                <!-- Inputs will be generated here -->
            </div>

            <button onclick="calculateUserDividends()">종합 배당금 계산하기</button>
            <div id="calc-result"></div>
            <p class="stock-list-info">* 지원 종목: 삼성전자, SK하이닉스, 맥쿼리인프라, TIGER 미국배당다우존스, SOL 미국배당다우존스, KODEX 미국배당프리미엄액티브, 리츠 등 (그 외 종목은 0원으로 계산됨)</p>
        </div>

        <div class="section">
            <h2>🏆 월배당 300만원 추천 포트폴리오</h2>
            <button class="secondary-btn" onclick="showPortfolio()">추천 포트폴리오 보기</button>
            <div id="portfolio-result"></div>
        </div>
    </div>

    <script>
        // Mock Data for Dividends
        const stockData = {
            "삼성전자": { name: "삼성전자", code: "005930", annualDividend: 1444 },
            "삼성전자우": { name: "삼성전자우", code: "005935", annualDividend: 1445 },
            "SK하이닉스": { name: "SK하이닉스", code: "000660", annualDividend: 1200 },
            "맥쿼리인프라": { name: "맥쿼리인프라", code: "088980", annualDividend: 770 },
            "TIGER 미국배당다우존스": { name: "TIGER 미국배당다우존스", code: "451150", annualDividend: 420 },
            "SOL 미국배당다우존스": { name: "SOL 미국배당다우존스", code: "446750", annualDividend: 400 },
            "KODEX 미국배당프리미엄액티브": { name: "KODEX 미국배당프리미엄액티브", code: "442450", annualDividend: 660 },
            "TIGER 미국테크TOP10+10%프리미엄": { name: "TIGER 미국테크TOP10+10%프리미엄", code: "474910", annualDividend: 1200 },
            "TIGER 리츠부동산인프라": { name: "TIGER 리츠부동산인프라", code: "329200", annualDividend: 360 },
            "신한지주": { name: "신한지주", code: "055550", annualDividend: 2100 },
            "KB금융": { name: "KB금융", code: "105560", annualDividend: 3000 },
            "현대차": { name: "현대차", code: "005380", annualDividend: 11400 },
            "ESR켄달스퀘어리츠": { name: "ESR켄달스퀘어리츠", code: "365550", annualDividend: 270 },
            "SK리츠": { name: "SK리츠", code: "395400", annualDividend: 260 },
            "제이알글로벌리츠": { name: "제이알글로벌리츠", code: "357250", annualDividend: 380 },
            "KODEX CD금리액티브(합성)": { name: "KODEX CD금리액티브(합성)", code: "459580", annualDividend: 30000 },
            "KIWOOM 미국고배당&AI테크": { name: "KIWOOM 미국고배당&AI테크", code: "492040", annualDividend: 384 },
            "KODEX 미국성장커버드콜액티브": { name: "KODEX 미국성장커버드콜액티브", code: "494050", annualDividend: 1140 },
            "SOL 코리아고배당": { name: "SOL 코리아고배당", code: "484150", annualDividend: 720 },
            "TIGER 미국배당다우존스타겟데일리커버드콜": { name: "TIGER 미국배당다우존스타겟데일리커버드콜", code: "502470", annualDividend: 1200 },
            "KODEX 미국배당커버드콜액티브": { name: "KODEX 미국배당커버드콜액티브", code: "494060", annualDividend: 1176 }
        };

        // Initialize Inputs with Dropdowns
        const inputContainer = document.getElementById('calculator-inputs');
        const stockOptions = Object.keys(stockData).filter(key => isNaN(key)); // Only use names, not codes

        for (let i = 1; i <= 10; i++) {
            const div = document.createElement('div');
            div.className = 'input-group';
            
            let optionsHTML = `<option value="">종목 선택</option>`;
            stockOptions.forEach(stock => {
                optionsHTML += `<option value="${stock}">${stock}</option>`;
            });

            div.innerHTML = `
                <label>${i}</label>
                <select id="name-${i}" style="padding: 10px; border: 1px solid #ddd; border-radius: 5px; flex: 1; margin-right: 5px;">
                    ${optionsHTML}
                </select>
                <input type="number" id="qty-${i}" placeholder="수량 (주)">
            `;
            inputContainer.appendChild(div);
        }

        function calculateUserDividends() {
            let totalAnnual = 0;
            let results = [];

            for (let i = 1; i <= 10; i++) {
                const name = document.getElementById(`name-${i}`).value;
                const qty = parseInt(document.getElementById(`qty-${i}`).value) || 0;

                if (name && qty > 0) {
                    const data = stockData[name];
                    const annual = data.annualDividend * qty;
                    totalAnnual += annual;
                    results.push({
                        name: data.name,
                        qty: qty,
                        unitDividend: data.annualDividend,
                        total: annual
                    });
                }
            }

            if (results.length === 0) {
                alert("종목과 수량을 입력해주세요.");
                return;
            }

            let resultHTML = `
                <div class="result-summary">
                    <h3>내 포트폴리오 배당금 결과</h3>
                    <p><strong>연간 총 배당금: ${totalAnnual.toLocaleString()}원</strong></p>
                    <p><strong>월평균 배당금: ${Math.floor(totalAnnual / 12).toLocaleString()}원</strong></p>
                </div>
                <table>
                    <tr>
                        <th>종목명</th>
                        <th>보유수량</th>
                        <th>주당 연배당금</th>
                        <th>연간 합계</th>
                    </tr>
            `;

            results.forEach(res => {
                resultHTML += `
                    <tr>
                        <td>${res.name}</td>
                        <td>${res.qty.toLocaleString()}주</td>
                        <td>${res.unitDividend.toLocaleString()}원</td>
                        <td>${res.total.toLocaleString()}원</td>
                    </tr>
                `;
            });
            resultHTML += `</table>`;
            document.getElementById('calc-result').innerHTML = resultHTML;
        }

        function showPortfolio() {
            const stocks = [
                { name: "TIGER 미국배당다우존스", dividendPerMonth: 35, shareCount: 30000, price: 11500, yield: 3.6 },
                { name: "TIGER 미국테크TOP10+10%프리미엄", dividendPerMonth: 100, shareCount: 10000, price: 12000, yield: 10.0 },
                { name: "TIGER 리츠부동산인프라", dividendPerMonth: 30, shareCount: 20000, price: 4500, yield: 8.0 },
                { name: "SOL 미국배당다우존스", dividendPerMonth: 33, shareCount: 15000, price: 11000, yield: 3.6 },
                { name: "KODEX 미국배당프리미엄액티브", dividendPerMonth: 55, shareCount: 10000, price: 10500, yield: 6.3 },
            ];

            let totalMonthlyDividend = 0;
            let totalRequiredCapital = 0;
            stocks.forEach(stock => {
                totalMonthlyDividend += stock.dividendPerMonth * stock.shareCount;
                totalRequiredCapital += stock.price * stock.shareCount;
            });

            let resultHTML = `
                <div class="result-summary" style="background: #f0fdf4;">
                    <p><strong>총 투자 필요 자산: 약 ${totalRequiredCapital.toLocaleString()}원</strong></p>
                    <p><strong>예상 월 합계 배당금: 약 ${totalMonthlyDividend.toLocaleString()}원</strong></p>
                </div>
                <table>
                    <tr>
                        <th>종목명</th>
                        <th>추천 주식수</th>
                        <th>주당 월배당</th>
                        <th>월 배당금</th>
                    </tr>
            `;

            stocks.forEach(stock => {
                resultHTML += `
                    <tr>
                        <td>${stock.name}</td>
                        <td>${stock.shareCount.toLocaleString()}주</td>
                        <td>${stock.dividendPerMonth.toLocaleString()}원</td>
                        <td>${(stock.dividendPerMonth * stock.shareCount).toLocaleString()}원</td>
                    </tr>
                `;
            });
            resultHTML += "</table>";
            document.getElementById("portfolio-result").innerHTML = resultHTML;
        }
    </script>
</body>
</html>
