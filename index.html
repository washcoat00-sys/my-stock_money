
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>월배당 300만원 만들기</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        button {
            margin: 10px 0;
            padding: 10px;
            font-size: 16px;
        }
        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 80%;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>월배당 300만원 포트폴리오</h1>
        <p>월 300만원의 배당금을 받기 위한 추천 포트폴리오입니다.</p>
        <button onclick="showPortfolio()">추천 종목 확인</button>
        <div id="result"></div>
    </div>

    <script>
        function showPortfolio() {
            const stocks = [
                { name: "삼성전자 우선주", dividendPerShare: 1500, shareCount: 5000, price: 50000, yield: 3.0 },
                { name: "맥쿼리인프라", dividendPerShare: 800, shareCount: 10000, price: 12800, yield: 6.25 },
                { name: "TIGER 미국배당다우존스", dividendPerShare: 400, shareCount: 20000, price: 11500, yield: 3.48 },
                { name: "SK텔레콤", dividendPerShare: 3500, shareCount: 1500, price: 56000, yield: 6.25 },
                { name: "신한지주", dividendPerShare: 2100, shareCount: 3500, price: 56000, yield: 3.75 },
            ];

            let totalAnnualDividend = 0;
            let totalRequiredCapital = 0;
            stocks.forEach(stock => {
                totalAnnualDividend += stock.dividendPerShare * stock.shareCount;
                totalRequiredCapital += stock.price * stock.shareCount;
            });

            let resultHTML = `
                <h2>추천 포트폴리오 결과</h2>
                <div style="background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #eee;">
                    <p><strong>총 투자 필요 자산: 약 ${totalRequiredCapital.toLocaleString()}원</strong></p>
                    <p>총 연간 배당금: 약 ${totalAnnualDividend.toLocaleString()}원</p>
                    <p><strong>월 평균 배당금: 약 ${(Math.floor(totalAnnualDividend / 12)).toLocaleString()}원</strong></p>
                </div>
                <table>
                    <tr>
                        <th>종목명</th>
                        <th>추천 주식수</th>
                        <th>현재가</th>
                        <th>월 배당금</th>
                        <th>연간 배당금</th>
                        <th>배당률</th>
                    </tr>
            `;

            stocks.forEach(stock => {
                const annualDividend = stock.dividendPerShare * stock.shareCount;
                const monthlyDividend = Math.floor(annualDividend / 12);
                resultHTML += `
                    <tr>
                        <td>${stock.name}</td>
                        <td>${stock.shareCount.toLocaleString()}주</td>
                        <td>${stock.price.toLocaleString()}원</td>
                        <td>${monthlyDividend.toLocaleString()}원</td>
                        <td>${annualDividend.toLocaleString()}원</td>
                        <td>${stock.yield}%</td>
                    </tr>
                `;
            });

            resultHTML += "</table>";

            document.getElementById("result").innerHTML = resultHTML;
        }
    </script>
</body>
</html>
