
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>월배당 300만원 만들기</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        button {
            margin: 10px 0;
            padding: 10px;
            font-size: 16px;
        }
        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 80%;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>월배당 300만원 포트폴리오</h1>
        <p>월 300만원의 배당금을 받기 위한 추천 포트폴리오입니다.</p>
        <button onclick="showPortfolio()">추천 종목 확인</button>
        <div id="result"></div>
    </div>

    <script>
        function showPortfolio() {
            const stocks = [
                { name: "삼성전자 우선주", dividendPerShare: 1444, shareCount: 4986 },
                { name: "맥쿼리인프라", dividendPerShare: 770, shareCount: 9350 },
                { name: "리얼티 인컴 (O)", dividendPerShare: 4000, shareCount: 1800 },
                { name: "코카-콜라 (KO)", dividendPerShare: 2500, shareCount: 2880 },
                { name: "신한지주", dividendPerShare: 2100, shareCount: 3428 },
            ];

            let totalAnnualDividend = 0;
            stocks.forEach(stock => {
                totalAnnualDividend += stock.dividendPerShare * stock.shareCount;
            });

            let resultHTML = `
                <h2>추천 포트폴리오</h2>
                <p>총 연간 배당금: 약 ${totalAnnualDividend.toLocaleString()}원 (월 약 ${(totalAnnualDividend / 12).toLocaleString()}원)</p>
                <table>
                    <tr>
                        <th>종목명</th>
                        <th>추천 주식수</th>
                        <th>연간 배당금</th>
                    </tr>
            `;

            stocks.forEach(stock => {
                const annualDividend = stock.dividendPerShare * stock.shareCount;
                resultHTML += `
                    <tr>
                        <td>${stock.name}</td>
                        <td>${stock.shareCount.toLocaleString()}주</td>
                        <td>${annualDividend.toLocaleString()}원</td>
                    </tr>
                `;
            });

            resultHTML += "</table>";

            document.getElementById("result").innerHTML = resultHTML;
        }
    </script>
</body>
</html>
