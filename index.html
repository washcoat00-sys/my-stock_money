
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5억 만들기 프로젝트</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        input, button {
            margin: 10px 0;
            padding: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>5억 만들기 프로젝트</h1>
        <label for="age">나이:</label>
        <input type="number" id="age" placeholder="나이를 입력하세요">
        <br>
        <label for="period">기간 (년):</label>
        <input type="number" id="period" placeholder="기간을 입력하세요">
        <br>
        <button onclick="calculate()">최적 방안 확인</button>
        <div id="result"></div>
    </div>

    <script>
        function calculate() {
            const age = parseInt(document.getElementById("age").value);
            const period = parseInt(document.getElementById("period").value);
            const targetAmount = 500000000;

            if (isNaN(age) || isNaN(period)) {
                document.getElementById("result").innerText = "나이와 기간을 올바르게 입력해주세요.";
                return;
            }

            const monthlySavings = targetAmount / (period * 12);

            let suggestion = "";
            if (monthlySavings > 5000000) {
                suggestion = "매월 저축액이 500만원을 초과합니다. 투자를 통해 수익률을 높이는 것을 고려해보세요. 예를 들어, 안정적인 인덱스 펀드에 장기 투자하는 방법이 있습니다.";
            } else if (monthlySavings > 2000000) {
                suggestion = "매월 꾸준히 저축하는 것이 중요합니다. 추가적으로 부수입을 만들 수 있는 방법을 찾아보는 것도 좋습니다.";
            } else {
                suggestion = "매월 저축액이 상대적으로 적습니다. 저축과 함께 소비 습관을 점검하고, 자신의 기술을 활용하여 부수입을 창출하는 것을 적극적으로 고려해보세요.";
            }

            const resultText = `
                <p>목표 기간 내 5억을 만들기 위해 매월 약 ${Math.round(monthlySavings).toLocaleString()}원을 저축해야 합니다.</p>
                <p><strong>제안:</strong> ${suggestion}</p>
            `;

            document.getElementById("result").innerHTML = resultText;
        }
    </script>
</body>
</html>
