
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>월배당 300만원 만들기</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        button {
            margin: 10px 0;
            padding: 10px;
            font-size: 16px;
        }
        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 80%;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>월배당 300만원 포트폴리오</h1>
        <p>월 300만원의 배당금을 받기 위한 추천 포트폴리오입니다.</p>
        <button onclick="showPortfolio()">추천 종목 확인</button>
        <div id="result"></div>
    </div>

    <script>
        function showPortfolio() {
            const stocks = [
                { name: "TIGER 미국배당다우존스", dividendPerMonth: 35, shareCount: 30000, price: 11500, yield: 3.6 },
                { name: "TIGER 미국테크TOP10+10%프리미엄", dividendPerMonth: 100, shareCount: 10000, price: 12000, yield: 10.0 },
                { name: "TIGER 리츠부동산인프라", dividendPerMonth: 30, shareCount: 20000, price: 4500, yield: 8.0 },
                { name: "SOL 미국배당다우존스", dividendPerMonth: 33, shareCount: 15000, price: 11000, yield: 3.6 },
                { name: "KODEX 미국배당프리미엄액티브", dividendPerMonth: 55, shareCount: 10000, price: 10500, yield: 6.3 },
            ];

            let totalMonthlyDividend = 0;
            let totalRequiredCapital = 0;
            stocks.forEach(stock => {
                totalMonthlyDividend += stock.dividendPerMonth * stock.shareCount;
                totalRequiredCapital += stock.price * stock.shareCount;
            });

            let resultHTML = `
                <h2>월배당 300만원 포트폴리오 결과 (ALL 월배당 ETF)</h2>
                <div style="background: #eef7ff; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #bce0fd;">
                    <p><strong>총 투자 필요 자산: 약 ${totalRequiredCapital.toLocaleString()}원</strong></p>
                    <p><strong>예상 월 합계 배당금: 약 ${totalMonthlyDividend.toLocaleString()}원</strong></p>
                    <p>예상 연간 합계 배당금: 약 ${(totalMonthlyDividend * 12).toLocaleString()}원</p>
                </div>
                <table>
                    <tr>
                        <th>종목명 (국내상장)</th>
                        <th>추천 주식수</th>
                        <th>현재가(추정)</th>
                        <th>주당 월 배당금</th>
                        <th>월 배당금</th>
                        <th>연 배당률</th>
                    </tr>
            `;

            stocks.forEach(stock => {
                const monthlyDividend = stock.dividendPerMonth * stock.shareCount;
                resultHTML += `
                    <tr>
                        <td>${stock.name}</td>
                        <td>${stock.shareCount.toLocaleString()}주</td>
                        <td>${stock.price.toLocaleString()}원</td>
                        <td>${stock.dividendPerMonth.toLocaleString()}원</td>
                        <td>${monthlyDividend.toLocaleString()}원</td>
                        <td>${stock.yield}%</td>
                    </tr>
                `;
            });

            resultHTML += "</table>";

            resultHTML += `
                <div style="margin-top: 30px; text-align: left; display: inline-block; width: 90%; max-width: 800px;">
                    <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                        <div style="flex: 1; min-width: 300px; background: #f0fff4; padding: 20px; border-radius: 10px; border: 1px solid #c6f6d5;">
                            <h3 style="color: #2f855a; margin-top: 0;">✅ 장점 (Pros)</h3>
                            <ul style="padding-left: 20px; line-height: 1.6;">
                                <li><strong>안정적인 현금 흐름</strong>: 매월 정해진 날짜에 배당금이 입금되어 생활비로 활용하거나 즉시 재투자가 가능합니다.</li>
                                <li><strong>절세 혜택 활용</strong>: ISA 계좌나 연금저축/IRP 계좌를 통해 투자할 경우 배당소득세 절세 및 과세 이연 효과를 극대화할 수 있습니다.</li>
                                <li><strong>접근성 및 편의성</strong>: 국내 시장 운영 시간에 원화로 즉시 거래가 가능하며, 환전 수수료가 발생하지 않습니다.</li>
                            </ul>
                        </div>
                        <div style="flex: 1; min-width: 300px; background: #fff5f5; padding: 20px; border-radius: 10px; border: 1px solid #fed7d7;">
                            <h3 style="color: #c53030; margin-top: 0;">⚠️ 단점 (Cons)</h3>
                            <ul style="padding-left: 20px; line-height: 1.6;">
                                <li><strong>배당소득세 부담</strong>: 일반 계좌 이용 시 배당금의 15.4%가 원천징수되며, 연간 2,000만 원 초과 시 금융소득종합과세 대상이 될 수 있습니다.</li>
                                <li><strong>자산 성장 정체</strong>: 배당에 집중하는 특성상 성장주 위주의 포트폴리오보다 원금의 가치 상승 속도가 느릴 수 있습니다.</li>
                                <li><strong>상방 제한(커버드콜)</strong>: 포트폴리오에 포함된 커버드콜 ETF는 하락장에서 방어력은 좋으나, 강력한 상승장에서 수익률이 제한됩니다.</li>
                            </ul>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById("result").innerHTML = resultHTML;
        }
    </script>
</body>
</html>
